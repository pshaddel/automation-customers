<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: light dark; --bg: #f4f4f6; --card: #fff; --text: #18181b; --muted: #71717a;
    --line: #e4e4e7; --accent: #4f46e5; --error: #dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f0f12; --card: #18181c; --text: #f4f4f5; --muted: #a1a1aa; --line: #2a2a30;
      --accent: #818cf8; --error: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
  main { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 28px; box-shadow: 0 8px 30px rgb(0 0 0 / .06); }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  form { display: grid; gap: 12px; }
  label { display: grid; gap: 4px; font-size: 13px; font-weight: 500; }
  input { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 11px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 10px; cursor: pointer;
    background: var(--accent); color: #fff; }
  button:disabled { opacity: .6; }
  .link { background: none; color: var(--accent); padding: 0; font-weight: 500; }
  .error { color: var(--error); font-size: 13px; min-height: 1.2em; margin: 0; }
  footer { margin-top: 20px; font-size: 13px; color: var(--muted); text-align: center; }
  a { color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="auth">
    <h1 id="title">Welcome back</h1>
    <p id="subtitle">Sign in to your account.</p>
    <form id="form">
      <label>Username <input name="username" required autocomplete="username" autocapitalize="off"></label>
      <label id="name-field" hidden>Name <input name="name" maxlength="100" autocomplete="name"></label>
      <label>Password <input name="password" type="password" required minlength="8" autocomplete="current-password"></label>
      <p class="error" id="error"></p>
      <button id="submit">Sign in</button>
    </form>
    <footer><span id="switch-text">No account?</span> <button class="link" id="switch">Create one</button></footer>
  </section>

  <section id="account" hidden>
    <h1>Hi, <span id="who"></span></h1>
    <p>You are signed in as <strong id="username"></strong>.</p>
    <form><button type="button" id="sign-out">Sign out</button></form>
    <footer><a href="/public/dashboard.html">Dashboard</a> · <a href="/openapi">API docs</a></footer>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let mode = "sign-in";

  async function api(path, body) {
    const res = await fetch(path, {
      method: body ? "POST" : "GET",
      headers: body ? { "content-type": "application/json" } : {},
      body: body && JSON.stringify(body),
    });
    const data = res.status === 204 ? null : await res.json().catch(() => null);
    if (!res.ok) throw new Error(data?.message || `Request failed (${res.status})`);
    return data;
  }

  function show(user) {
    $("auth").hidden = !!user;
    $("account").hidden = !user;
    if (user) { $("who").textContent = user.name; $("username").textContent = "@" + user.username; }
  }

  function setMode(next) {
    mode = next;
    const signUp = mode === "sign-up";
    $("title").textContent = signUp ? "Create account" : "Welcome back";
    $("subtitle").textContent = signUp ? "Lowercase letters, digits and _ for the username." : "Sign in to your account.";
    $("submit").textContent = signUp ? "Create account" : "Sign in";
    $("switch-text").textContent = signUp ? "Already have an account?" : "No account?";
    $("switch").textContent = signUp ? "Sign in" : "Create one";
    $("name-field").hidden = !signUp;
    $("form").name.required = signUp;
    $("form").password.autocomplete = signUp ? "new-password" : "current-password";
    $("error").textContent = "";
  }

  $("switch").onclick = () => setMode(mode === "sign-in" ? "sign-up" : "sign-in");

  $("form").onsubmit = async (e) => {
    e.preventDefault();
    const { username, name, password } = Object.fromEntries(new FormData(e.target));
    const body = mode === "sign-up" ? { username, name, password } : { username, password };
    $("submit").disabled = true;
    $("error").textContent = "";
    try {
      show(await api(`/api/auth/${mode}`, body));
      e.target.reset();
    } catch (err) {
      $("error").textContent = err.message;
    } finally {
      $("submit").disabled = false;
    }
  };

  $("sign-out").onclick = async () => {
    await api("/api/auth/sign-out", {}).catch(() => {});
    setMode("sign-in");
    show(null);
  };

  api("/api/me").then(show, () => show(null));
</script>
</body>
</html>
